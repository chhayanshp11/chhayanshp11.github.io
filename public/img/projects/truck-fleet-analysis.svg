<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg2)"/>

  <!-- Grid -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- Bar chart - risk scores -->
  <g transform="translate(80, 60)">
    <!-- Axes -->
    <line x1="40" y1="0" x2="40" y2="240" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="240" x2="340" y2="240" stroke="#334155" stroke-width="1"/>

    <!-- Bars -->
    <rect x="60" y="40" width="40" height="200" rx="4" fill="#ef4444" opacity="0.8"/>
    <rect x="120" y="80" width="40" height="160" rx="4" fill="#f97316" opacity="0.8"/>
    <rect x="180" y="110" width="40" height="130" rx="4" fill="#eab308" opacity="0.7"/>
    <rect x="240" y="150" width="40" height="90" rx="4" fill="#22c55e" opacity="0.6"/>
    <rect x="300" y="180" width="40" height="60" rx="4" fill="#22c55e" opacity="0.5"/>

    <!-- Labels -->
    <text x="80" y="260" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">D-01</text>
    <text x="140" y="260" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">D-02</text>
    <text x="200" y="260" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">D-03</text>
    <text x="260" y="260" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">D-04</text>
    <text x="320" y="260" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">D-05</text>

    <text x="20" y="45" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8" transform="rotate(-90, 20, 120)">Risk Score</text>
  </g>

  <!-- Right side - data flow -->
  <g transform="translate(480, 80)">
    <!-- HDFS -->
    <rect x="0" y="0" width="110" height="55" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="55" y="25" text-anchor="middle" fill="#0ea5e9" font-family="system-ui" font-size="11" font-weight="600">HDFS</text>
    <text x="55" y="42" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8">10K Records</text>

    <!-- Arrow -->
    <line x1="55" y1="55" x2="55" y2="85" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 3"/>
    <polygon points="50,85 55,93 60,85" fill="#0ea5e9"/>

    <!-- Hive -->
    <rect x="0" y="95" width="110" height="55" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="55" y="120" text-anchor="middle" fill="#eab308" font-family="system-ui" font-size="11" font-weight="600">Hive + Pig</text>
    <text x="55" y="137" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8">Analysis</text>

    <!-- Arrow -->
    <line x1="55" y1="150" x2="55" y2="180" stroke="#eab308" stroke-width="1" stroke-dasharray="4 3"/>
    <polygon points="50,180 55,188 60,180" fill="#eab308"/>

    <!-- Tableau -->
    <rect x="0" y="190" width="110" height="55" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="55" y="215" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="11" font-weight="600">Tableau</text>
    <text x="55" y="232" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8">92% Accuracy</text>

    <!-- Sqoop label -->
    <rect x="140" y="10" width="90" height="35" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="185" y="32" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="9" font-weight="500">Sqoop</text>
    <line x1="140" y1="27" x2="110" y2="27" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <!-- Label -->
  <text x="400" y="375" text-anchor="middle" fill="#475569" font-family="system-ui" font-size="12" letter-spacing="4">FLEET RISK ANALYSIS</text>
</svg>
