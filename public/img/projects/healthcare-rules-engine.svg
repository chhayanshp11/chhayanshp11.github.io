<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg3)"/>

  <!-- Grid -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- Database source -->
  <g transform="translate(60, 100)">
    <ellipse cx="60" cy="15" rx="55" ry="15" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="5" y="15" width="110" height="60" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <ellipse cx="60" cy="75" rx="55" ry="15" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="5" y1="15" x2="5" y2="75" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="115" y1="15" x2="115" y2="75" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="60" y="50" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="11" font-weight="600">CDC</text>
    <text x="60" y="65" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8">Change Data</text>
  </g>

  <!-- Arrow -->
  <line x1="180" y1="145" x2="260" y2="145" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="260,140 270,145 260,150" fill="#8b5cf6"/>

  <!-- Rules Engine center -->
  <g transform="translate(270, 80)">
    <rect x="0" y="0" width="200" height="130" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="13" font-weight="700">Rules Engine</text>

    <!-- Rule rows -->
    <rect x="15" y="45" width="170" height="22" rx="4" fill="#0f172a"/>
    <circle cx="30" cy="56" r="4" fill="#22c55e"/>
    <text x="42" y="60" fill="#94a3b8" font-family="system-ui" font-size="9">Rule 1: Eligibility Check</text>

    <rect x="15" y="72" width="170" height="22" rx="4" fill="#0f172a"/>
    <circle cx="30" cy="83" r="4" fill="#eab308"/>
    <text x="42" y="87" fill="#94a3b8" font-family="system-ui" font-size="9">Rule 2: Quality Validation</text>

    <rect x="15" y="99" width="170" height="22" rx="4" fill="#0f172a"/>
    <circle cx="30" cy="110" r="4" fill="#22c55e"/>
    <text x="42" y="114" fill="#94a3b8" font-family="system-ui" font-size="9">Rule 3: Compliance Audit</text>
  </g>

  <!-- Arrow out -->
  <line x1="470" y1="145" x2="540" y2="145" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="540,140 550,145 540,150" fill="#10b981"/>

  <!-- QC Dashboard -->
  <g transform="translate(550, 90)">
    <rect x="0" y="0" width="170" height="110" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="85" y="25" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="11" font-weight="600">QC Dashboard</text>

    <!-- Mini stat boxes -->
    <rect x="12" y="38" width="65" height="28" rx="5" fill="#0f172a"/>
    <text x="44" y="50" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="11" font-weight="700">60%</text>
    <text x="44" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Efficiency</text>

    <rect x="90" y="38" width="65" height="28" rx="5" fill="#0f172a"/>
    <text x="122" y="50" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">SQL</text>
    <text x="122" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Logic Rules</text>

    <!-- Progress bar -->
    <rect x="12" y="78" width="146" height="6" rx="3" fill="#0f172a"/>
    <rect x="12" y="78" width="100" height="6" rx="3" fill="#10b981"/>
    <text x="12" y="98" fill="#64748b" font-family="system-ui" font-size="7">Registry Quality Score</text>
  </g>

  <!-- Label -->
  <text x="400" y="370" text-anchor="middle" fill="#475569" font-family="system-ui" font-size="12" letter-spacing="4">HEALTHCARE RULES ENGINE</text>
</svg>
