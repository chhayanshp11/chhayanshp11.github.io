<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg1)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- S3 Bucket -->
  <rect x="80" y="140" width="120" height="80" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="140" y="172" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="11" font-weight="600">S3</text>
  <text x="140" y="192" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Raw Data</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="180" x2="270" y2="180" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="270,175 280,180 270,185" fill="#f97316"/>

  <!-- Lambda -->
  <rect x="280" y="140" width="120" height="80" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="340" y="172" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="11" font-weight="600">Lambda</text>
  <text x="340" y="192" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Transform</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="180" x2="470" y2="180" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="470,175 480,180 470,185" fill="#f97316"/>

  <!-- Glue -->
  <rect x="480" y="140" width="120" height="80" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="540" y="172" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="11" font-weight="600">Glue</text>
  <text x="540" y="192" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">ETL</text>

  <!-- Arrow 3 -->
  <line x1="600" y1="180" x2="670" y2="180" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="670,175 680,180 670,185" fill="#f97316"/>

  <!-- Redshift -->
  <rect x="680" y="140" width="100" height="80" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="730" y="172" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="11" font-weight="600">Redshift</text>
  <text x="730" y="192" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Analytics</text>

  <!-- Athena query below -->
  <line x1="730" y1="220" x2="730" y2="270" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="670" y="270" width="120" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="730" y="300" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="500">Athena</text>

  <!-- Python source -->
  <line x1="140" y1="140" x2="140" y2="90" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="90" y="50" width="100" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="140" y="75" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="500">Python</text>

  <!-- AWS cloud label -->
  <text x="400" y="370" text-anchor="middle" fill="#475569" font-family="system-ui" font-size="12" letter-spacing="4">AWS DATA PIPELINE</text>
</svg>
